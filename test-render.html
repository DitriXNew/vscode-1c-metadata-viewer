<!DOCTYPE html>
<html>
<head>
    <title>Form Preview Test</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #2d2d2d;
            color: white;
        }
        .container {
            display: flex;
            gap: 20px;
        }
        .panel {
            flex: 1;
        }
        h2 {
            margin-top: 0;
        }
        #formCanvas {
            border: 1px solid #555;
            background: #1E1E1E;
        }
        #debugLog {
            background: #1a1a1a;
            padding: 10px;
            height: 400px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
            white-space: pre-wrap;
        }
        .log-entry { color: #aaa; }
        .log-warn { color: #f0ad4e; }
        .log-error { color: #d9534f; }
    </style>
</head>
<body>
    <h1>Form Preview Test</h1>
    <div class="container">
        <div class="panel">
            <h2>Canvas</h2>
            <canvas id="formCanvas" width="800" height="600"></canvas>
        </div>
        <div class="panel">
            <h2>Debug Log</h2>
            <div id="debugLog"></div>
        </div>
    </div>

    <!-- Load the webview bundle -->
    <script>
        // Mock VS Code API
        window.acquireVsCodeApi = function() {
            return {
                postMessage: function(msg) {
                    log('postMessage: ' + JSON.stringify(msg));
                    
                    // Когда webview готов, отправляем тестовые данные
                    if (msg.type === 'ready') {
                        sendTestForm();
                    }
                }
            };
        };

        function log(msg, type = 'log') {
            const div = document.getElementById('debugLog');
            const entry = document.createElement('div');
            entry.className = 'log-entry log-' + type;
            entry.textContent = new Date().toLocaleTimeString() + ': ' + msg;
            div.appendChild(entry);
            div.scrollTop = div.scrollHeight;
        }

        // Override console.log
        const origLog = console.log;
        console.log = function(...args) {
            origLog.apply(console, args);
            log(args.map(a => typeof a === 'object' ? JSON.stringify(a, null, 2) : a).join(' '));
        };
        console.warn = function(...args) {
            log(args.map(a => typeof a === 'object' ? JSON.stringify(a, null, 2) : a).join(' '), 'warn');
        };
        console.error = function(...args) {
            log(args.map(a => typeof a === 'object' ? JSON.stringify(a, null, 2) : a).join(' '), 'error');
        };

        // Test data - simple form
        const testForm = {
            "name": "Form",
            "width": 800,
            "height": 600,
            "items": [
                {
                    "name": "AutoCommandBar",
                    "type": "AutoCommandBar",
                    "items": [
                        {
                            "name": "FormWriteAndClose",
                            "commandName": "FormWriteAndClose",
                            "title": { "values": { "ru": "Сохранить и закрыть" } },
                            "type": "UsualButton"
                        },
                        {
                            "name": "FormWrite",
                            "commandName": "FormWrite",
                            "title": { "values": { "ru": "Сохранить" } },
                            "type": "UsualButton"
                        },
                        {
                            "name": "FormHelp",
                            "commandName": "FormHelp",
                            "title": { "values": { "ru": "Еще" } },
                            "type": "UsualButton"
                        }
                    ]
                },
                {
                    "name": "Code",
                    "type": "InputField",
                    "title": { "values": { "ru": "Код" } },
                    "titleLocation": "Left"
                },
                {
                    "name": "Country",
                    "type": "InputField",
                    "title": { "values": { "ru": "Страна" } },
                    "titleLocation": "Left",
                    "choiceButton": true
                }
            ]
        };

        function sendTestForm() {
            log('Sending test form data...');
            window.dispatchEvent(new MessageEvent('message', {
                data: {
                    type: 'renderForm',
                    data: {
                        form: testForm,
                        options: { locale: 'ru' }
                    }
                }
            }));
        }
    </script>
    
    <!-- Load the compiled webview bundle -->
    <script src="out/webview/edtFormPreview.js"></script>
</body>
</html>
